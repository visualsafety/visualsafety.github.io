<!DOCTYPE html>
<html lang="es-es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Visual Safety | Aplicación Web</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      /* ESTILOS CORPORATIVOS VISUAL SAFETY */
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body { 
        display: flex;
        flex-direction: column; 
        background-color: #ffffff; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      
      /* Barra superior roja */
      .header-bar {
        background-color: #c30000;
        height: 60px;
        display: flex;
        align-items: center;
        padding: 0 5%; /* Margen lateral */
        color: white;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        flex-shrink: 0;
      }

      /* Estilo para el logo de la empresa */
      .company-logo {
        height: 40px; /* Ajusta la altura según necesites */
        margin-right: 15px; /* Espacio entre el logo y el texto */
        width: auto;
        display: block;
      }

      /* Barra inferior roja */
      .footer-bar {
        background-color: #c30000;
        height: 30px;
        width: 100%;
        margin-top: auto; 
        flex-shrink: 0;
      }

      .logo-text {
        font-weight: bold;
        letter-spacing: 1px;
        font-size: 1.2rem;
      }

      /* Contenedor del Juego */
      #unity-container { 
        position: relative; 
        width: 100%; 
        flex-grow: 1; 
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px 0;
      }

      #unity-canvas { 
        width: 1280px; 
        height: 720px; 
        background: #231f20; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        border-radius: 4px;
      }

      /* Barra de carga */
      #unity-loading-bar { 
        position: absolute; 
        display: none; 
      }
      
      #unity-progress-bar-empty { 
        width: 141px; 
        height: 18px; 
        background: rgba(0, 0, 0, 0.1); 
        border-radius: 10px;
        overflow: hidden;
      }

      #unity-progress-bar-full { 
        width: 0%; 
        height: 100%; 
        background: #c30000; 
      }

      /* Botón Fullscreen */
      #unity-footer-controls { 
        width: 1280px; 
        display: flex; 
        justify-content: flex-end; 
        margin-top: 10px;
      }

      #unity-fullscreen-button { 
        width: 30px; 
        height: 30px; 
        background: url('TemplateData/fullscreen-button.png') no-repeat center; 
        background-size: contain; 
        cursor: pointer;
        opacity: 0.5;
        transition: 0.3s;
      }
      #unity-fullscreen-button:hover { opacity: 1; }

      /* Móvil */
      .unity-mobile #unity-canvas { width: 100%; height: 100%; border-radius: 0; }
    </style>
  </head>
  <body>

    <div class="header-bar">
      <img src="TemplateData/LogoEmpresa.png" alt="Logo" class="company-logo">
      <div class="logo-text">VISUAL SAFETY</div>
    </div>

    <div id="unity-container">
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <p style="color: #666; text-align: center; font-size: 12px; margin-top: 5px;">Iniciando sistema...</p>
      </div>

      <canvas id="unity-canvas" tabindex="-1"></canvas>
      
      <div id="unity-footer-controls">
        <div id="unity-fullscreen-button" title="Pantalla Completa"></div>
      </div>
    </div>

    <div class="footer-bar"></div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebBuild.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebBuild.data.unityweb",
        frameworkUrl: buildUrl + "/WebBuild.framework.js.unityweb",
        codeUrl: buildUrl + "/WebBuild.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Visual Safety",
        productName: "WebExample",
        productVersion: "1.0",
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
