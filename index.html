<!DOCTYPE html>
<html lang="es-es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Visual Safety | Aplicación Web</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      /* ESTILOS INSPIRADOS EN LA IMAGEN CORPORATIVA */
      body { 
        padding: 0; 
        margin: 0; 
        background-color: #ffffff; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      
      /* Barra superior roja */
      .header-bar {
        background-color: #c30000;
        height: 60px;
        display: flex;
        align-items: center;
        padding: 0 5%;
        color: white;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }

      .logo-text {
        font-weight: bold;
        letter-spacing: 1px;
        font-size: 1.2rem;
      }

      /* Contenedor del Juego */
      #unity-container { 
        position: relative; 
        width: 100%; 
        margin-top: 30px;
      }

      #unity-canvas { 
        width: 1280px; 
        height: 720px; 
        background: #231f20; 
        display: block; 
        margin: 0 auto;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        border-radius: 4px;
      }

      /* Barra de carga personalizada */
      #unity-loading-bar { 
        position: absolute; 
        left: 50%; 
        top: 50%; 
        transform: translate(-50%, -50%); 
        display: none; 
      }
      
      #unity-progress-bar-empty { 
        width: 141px; 
        height: 18px; 
        margin-top: 10px; 
        background: rgba(255, 255, 255, 0.2); 
        border-radius: 10px;
        overflow: hidden;
      }

      #unity-progress-bar-full { 
        width: 0%; 
        height: 100%; 
        background: #c30000; /* Rojo corporativo */
      }

      #unity-footer { 
        width: 1280px; 
        margin: 10px auto; 
        display: flex; 
        justify-content: flex-end; 
      }

      #unity-fullscreen-button { 
        width: 38px; 
        height: 38px; 
        background: url('TemplateData/fullscreen-button.png') no-repeat center; 
        background-size: contain; 
        cursor: pointer;
        opacity: 0.6;
        transition: 0.3s;
      }
      #unity-fullscreen-button:hover { opacity: 1; }

      /* Ajustes para móviles */
      .unity-mobile #unity-canvas { width: 100%; height: 100%; margin: 0; border-radius: 0; }
    </style>
  </head>
  <body>

    <div class="header-bar">
      <div class="logo-text">VISUAL SAFETY</div>
    </div>

    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <p style="color: #666; text-align: center; font-size: 12px;">Cargando experiencia...</p>
      </div>

      <div id="unity-footer">
        <div id="unity-fullscreen-button" title="Pantalla Completa"></div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebBuild.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebBuild.data.unityweb",
        frameworkUrl: buildUrl + "/WebBuild.framework.js.unityweb",
        codeUrl: buildUrl + "/WebBuild.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Visual Safety",
        productName: "WebExample",
        productVersion: "1.0",
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
